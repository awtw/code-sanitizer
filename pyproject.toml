[project]
name = "code-sanitizer"
version = "0.1.0"
description = "De-identify source code before handing it to red teams and AI tools"
requires-python = ">=3.11"
dependencies = [
  "dulwich>=0.22",
  "pyyaml>=6",
  "tree-sitter>=0.26.0",
  "tree-sitter-css>=0.25.0",
  "tree-sitter-html>=0.23.2",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-scss>=1.0.0",
  "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
sanitizer = "sanitizer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sanitizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: installs dependencies and builds fixture projects"]
addopts = "-m 'not slow'"
norecursedirs = ["tests/fixtures/sources"]
